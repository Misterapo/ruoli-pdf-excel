<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missione Charvensod 🎮</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#d7f6ff,transparent 35%),radial-gradient(circle at 100% 100%,#fff2c3,transparent 45%),#f4f7ff;font-family:'Trebuchet MS',system-ui,sans-serif;color:#183b5d}button{cursor:pointer;font:inherit;font-weight:900;transition:.13s}button:hover{transform:translateY(-2px)}button:active{transform:scale(.98)}button:focus-visible{outline:4px solid orange}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 0 14px;flex-wrap:wrap}header b{font-size:clamp(17px,2vw,27px)}header button{border:2px solid #cce4ef;border-radius:14px;padding:9px 13px;background:white;color:#183b5d}#app{max-width:1280px;margin:auto;padding:18px}main{border:3px solid #dceaf3;border-radius:28px;background:white;min-height:calc(100vh - 120px);box-shadow:0 13px 35px #17365a17;overflow:hidden;display:flex;flex-direction:column}.pad{padding:clamp(20px,4vw,52px)}h1{font-size:clamp(45px,6vw,82px);line-height:1.03;margin:12px 0}h2{font-size:clamp(27px,3.3vw,48px);line-height:1.08;margin:0 0 16px}p{font-size:clamp(18px,1.9vw,24px);line-height:1.4}.btn{background:#ffcd52;border:0;border-radius:18px;padding:17px 25px;color:#503a18;box-shadow:0 6px #de9e21;font-size:clamp(20px,2.2vw,28px)}.pill{display:inline-block;background:#e1f6fb;color:#155d81;border-radius:99px;padding:9px 17px;font-weight:bold;font-size:16px}.intro{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:35px;flex:1}.art{background:linear-gradient(#bceafa 0 58%,#c5eba7 58%);border-radius:26px;min-height:360px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.art:before{content:'☀️';position:absolute;right:30px;top:20px;font-size:60px}.house{font-size:clamp(110px,17vw,210px);filter:drop-shadow(0 12px 8px #1a587128)}.heroes{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:clamp(38px,5vw,62px)}.little{color:#597282}.bar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}.dots{display:flex;gap:10px}.dot{width:28px;height:14px;background:#dde7ef;border-radius:9px}.dot.now{background:#ffbf42}.dot.done{background:#36b79a}.tag{background:#e5f5f8;padding:8px 14px;border-radius:15px;font-weight:900;color:#146b7a}.layout{display:grid;grid-template-columns:38% 1fr;gap:27px;flex:1}.scene{border-radius:25px;background:linear-gradient(145deg,#bfe9ff,#e2f6ff);padding:clamp(20px,2.7vw,35px);display:flex;flex-direction:column;justify-content:space-around;align-items:center;text-align:center;border:2px solid #c7e7f7}.emoji{font-size:clamp(88px,11vw,160px)}.speech{font-size:clamp(21px,2.3vw,30px);line-height:1.3;font-weight:bold;background:white;padding:18px;border-radius:20px;box-shadow:0 6px #a7cee04a}.info{font-size:clamp(17px,1.8vw,23px)}.question{font-weight:900;font-size:clamp(20px,2.1vw,27px)}.choices{display:grid;gap:13px}.choice{background:#f7fafc;border:3px solid #dce9ef;border-radius:18px;padding:13px 18px;min-height:75px;color:#1e4664;text-align:left;font-size:clamp(18px,1.75vw,23px);display:flex;align-items:center;gap:14px}.choice:hover{background:#e5f6ff;border-color:#65bdd8}.choice.good{background:#e1fff0;border-color:#33bc8e}.choice.bad{background:#fff0ed;border-color:#ed8579}.feedback{margin-top:13px;padding:15px 18px;background:#e2fff0;border-radius:16px;font-size:clamp(18px,1.7vw,22px);font-weight:700}.feedback.no{background:#fff0e8}.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:19px;flex-wrap:wrap}.help{border:2px solid #d6e5ec;background:white;border-radius:13px;padding:12px;color:#145879}.foot{margin-top:auto;border-top:2px solid #edf0f4;padding:12px;text-align:center;color:#557187;font-size:15px}.win{text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.trophy{font-size:110px}.score{font-size:clamp(42px,5vw,70px);font-weight:1000;color:#e19915;margin:0}.tiny{font-size:16px;margin:4px}.bullets{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.bullets span{background:#eef6ff;padding:9px 12px;border-radius:14px;font-weight:bold}@media(max-width:850px){.intro,.layout{grid-template-columns:1fr}.art{min-height:210px}.house{font-size:110px}.heroes{font-size:40px}.scene{padding:10px}.emoji{font-size:68px}.speech{font-size:17px}.pad{padding:18px}main{min-height:calc(100vh - 120px)}}
</style><div id="app"></div><script>
(()=>{let step=-1,score=0,tries=0,done=false,wrong=-1,tip=false,sound=true,msg='';const m=[
['🪪 ANAGRAFE','La carta per partire','🧒🪪','Emma, 8 anni','«Devo partire per una gita, mi serve una carta d’identità!»','Dove mandiamo Emma con la sua famiglia?',['🏛️ Allo sportello Anagrafe','⚽ Al campo da calcio','🎨 La disegniamo noi'],0,'L’Anagrafe aiuta i cittadini con i documenti ufficiali.','Cerca l’ufficio dei documenti.'],
['💻 INFORMATICA','Il sito è scomparso!','💻⚠️','Un cittadino','«Non riesco più a vedere le notizie sul sito del Comune!»','Che cosa facciamo?',['🩹 Mettiamo un cerotto sul monitor','🧑‍💻 Chiamiamo chi segue l’informatica','🙈 Facciamo finta di niente'],1,'Chi segue l’informatica controlla siti, computer e programmi.','Un sito non si ripara con un cerotto!'],
['📋 SEGRETERIA','Una decisione importante','🧑‍💼📋','Il Sindaco','«Abbiamo preso una decisione: ora come la mettiamo per iscritto?»','Chi prepara e conserva gli atti del Comune?',['🗂️ La Segreteria','📝 Un post-it sul frigorifero','🗣️ Basta dirlo a voce'],0,'La Segreteria aiuta a organizzare riunioni, atti e documenti.','Pensa a chi organizza i documenti.'],
['🌐 SERVIZI DIGITALI','La festa del paese!','🎉🌍','Gli organizzatori','«Sabato c’è una festa: dobbiamo avvisare tutte le famiglie!»','Dove pubblichiamo la notizia?',['🤫 Non diciamo niente a nessuno','📱 Lo diciamo solo a un amico','🌍 Sul sito Internet del Comune'],2,'Sul sito comunale si trovano avvisi, notizie e servizi.','Dove possono leggere le novità tutti i cittadini?'],
['🔐 SICUREZZA','La password segreta','📧🛡️','Una email sospetta','«Mandami subito la password del computer del Comune!»','Cosa rispondiamo?',['📨 Mandiamo la password','🔒 Non la condividiamo e avvisiamo l’informatica','🖱️ Clicchiamo su tutti i link'],1,'Le password sono segrete: proteggono i dati dei cittadini!','La password è come la chiave di casa.']
];const el=document.getElementById('app');function beep(ok){if(!sound)return;try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=ok?740:190;g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.17);o.start();o.stop(a.currentTime+.18)}catch(e){}}function top(){return `<header><b>🏛️ MISSIONE CHARVENSOD</b><div><button onclick="soundToggle()">${sound?'🔊':'🔇'} Suoni</button> <button onclick="full()">⛶ Schermo intero</button> <button>⭐ ${score} punti</button></div></header>`}function render(){if(step<0){el.innerHTML=top()+`<main><div class="pad intro"><div><span class="pill">🎮 GIOCO PER PICCOLI CITTADINI · 5 MINUTI</span><h1>Missione<br><span style="color:#ed8950">Charvensod!</span></h1><p>Oggi siete voi la squadra del Sindaco! Risolvete <b>5 missioni</b> per aiutare i cittadini e far funzionare il Comune.</p><div class="bullets"><span>🪪 Documenti</span><span>💻 Computer</span><span>📋 Segreteria</span></div><button class="btn" onclick="start()">🚀 INIZIA IL GIOCO!</button></div><div class="art"><div class="house">🏛️</div><div class="heroes">🧒👧🧑‍💻</div></div></div><div class="foot">Giocate tutti insieme! Scegliete la risposta con un clic o i tasti 1, 2 e 3.</div></main>`;return}if(step>=m.length){el.innerHTML=top()+`<main><div class="pad win"><div class="trophy">🏆🎉</div><span class="pill">MISSIONE COMPLETATA!</span><h1>Siete fantastici!</h1><p>Avete aiutato i cittadini, il Sindaco e i computer del Comune!</p><div class="score">⭐ ${score} / 50 PUNTI</div><p>Diploma: <b>PICCOLI ESPERTI DEL COMUNE</b> 🏛️</p><button class="btn" onclick="reset()">🔁 GIOCA ANCORA</button></div></main>`;return}let q=m[step];el.innerHTML=top()+`<main><div class="pad" style="flex:1;display:flex;flex-direction:column"><div class="bar"><span class="tag">🚩 MISSIONE ${step+1} DI 5 · ${q[0]}</span><div class="dots">${m.map((_,i)=>`<i class="dot ${i<step?'done':i===step?'now':''}"></i>`).join('')}</div></div><div class="layout"><div class="scene"><div class="tag">📣 ${q[3]}</div><div class="emoji">${q[2]}</div><div class="speech">${q[4]}</div></div><div><h2>${q[1]}</h2><p class="question">👉 ${q[5]}</p><div class="choices">${q[6].map((c,i)=>`<button ${done?'disabled':''} class="choice ${done&&i===q[7]?'good':i===wrong?'bad':''}" onclick="choose(${i})"><span>${c}</span></button>`).join('')}</div>${msg?`<div class="feedback ${done?'':'no'}">${msg}</div>`:''}${tip&&!done?`<div class="feedback">💡 ${q[9]}</div>`:''}<div class="actions">${!done?'<button class="help" onclick="hint()">💡 Un indizio?</button>':'<b>✅ Problema risolto!</b>'}${done?`<button class="btn" onclick="next()">${step===4?'🏆 RISULTATO':'AVANTI ➜'}</button>`:''}</div></div></div></div><div class="foot">🎯 Ragionate insieme: nel Comune tante persone lavorano in squadra!</div></main>`}window.start=()=>{step=0;render()};window.choose=i=>{if(done)return;if(i===m[step][7]){done=true;score+=tries?7:10;msg='🎉 BRAVISSIMI! '+m[step][8]+(tries?' (+7 punti)':' (+10 punti)');beep(true)}else{tries++;wrong=i;msg='😅 Ops! Non è la scelta migliore. Provate ancora!';beep(false)}render()};window.hint=()=>{tip=!tip;render()};window.next=()=>{step++;tries=0;done=false;wrong=-1;msg='';tip=false;render()};window.reset=()=>{score=0;step=-1;render()};window.soundToggle=()=>{sound=!sound;render()};window.full=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(step>=0&&step<5&&!done&&/^[123]$/.test(e.key))choose(Number(e.key)-1);else if(e.key==='Enter'){if(step<0)start();else if(done)next()}});render()})();
</script></html>

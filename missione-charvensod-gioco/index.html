function renderHome(){const done=OFFICIAL.filter(x=>state.completed.has(x.id)).length;app.innerHTML=`<section class="hero"><div class="hero-text"><div class="eyebrow">🎮 Il videogame del Comune · CCR 2026</div><h1>Il Comune ha<br><span>bisogno di TE!</span></h1><p>Diventa un eroe del Comune: risolvi enigmi, difendi i computer e salva la giornata. Ogni ufficio ha una missione diversa!</p><div class="tagline"><span class="chip">👦 6–10 anni</span><span class="chip">⏱️ 5 minuti</span><span class="chip">✨ Punti e timbri</span></div><div class="btns"><button class="btn primary" data-act="quick">🚀 GIOCA ORA!</button><button class="btn white" data-act="explore">🏛️ Scopri gli uffici</button></div></div><div class="hero-art">${svgVillage()}</div></section><div class="section-top"><div><h2>🌈 Scegli il tuo ufficio!</h2><p>11 luoghi da esplorare, 11 missioni e tanti timbri da conquistare.</p></div><div class="meter">🏅 <span>${done}/10 timbri</span> · ⭐ ${state.score} punti</div></div><div class="map">${OFFICIAL.map((o,i)=>`<button class="office" style="--wash:${o.color}18" data-act="office" data-id="${o.id}"><span class="emoji">${icon(o)}</span>${state.completed.has(o.id)?'<span class="stamp">✔</span>':''}<strong class="nm"><small>${String(i+1).padStart(2,'0')} · </small>${esc(o.name)}</strong><small>${state.completed.has(o.id)?'Timbro conquistato':'Entra nell’ufficio →'}</small></button>`).join('')}<button class="office bonus" data-act="office" data-id="informatica"><span class="emoji">💻</span>${state.completed.has('informatica')?'<span class="stamp">✔</span>':''}<strong class="nm">BONUS · Informatica</strong><small>Difendi il Comune online →</small></button></div><div class="quick-choice"><div class="modebox"><strong>🎯 Per giocare tutti insieme</strong><p>5 missioni a difficoltà crescente: documenti, cittadini, informatica, scelte di spesa e segreteria.</p><button class="btn teal" data-act="quick">Inizia · circa 5 minuti</button></div><div class="modebox"><strong>📱 Per le insegnanti</strong><p>Un QR code per il gioco e schede con QR dedicati ai 10 uffici del passaporto CCR, più informatica.</p><button class="btn outline" data-act="teachers">Apri tutti i QR →</button></div></div>`}
function side(o){return `<aside class="panel helpbox"><div class="helpicon">🏛️</div><h3>Lo sapevi?</h3><p>${esc(o.description)}</p><div class="statusbar">📚 Passaporto CCR</div><h3>La squadra conta su di te</h3><p>Ogni scelta giusta aiuta il Comune a funzionare e fa guadagnare un timbro.</p><div class="stats"><span class="stat">⭐ ${state.score} pt</span><span class="stat">🏅 ${state.completed.size} timbri</span></div><p style="margin-top:22px"><button class="btn soft" data-act="sheet" data-id="${o.id}">📱 Scheda insegnanti</button></p></aside>`}
function renderQuest(){let o=get(state.current);if(!o){renderHome();return}let quick=state.mode==='quick',title=quick?`Missione ${state.quickIndex+1} di ${QUICK.length}`:'Esplora l’ufficio';let pct=quick?Math.round(state.quickIndex/QUICK.length*100):Math.round(state.completed.size/DATA.length*100);let answered=state.feedback==='good';let wrong=state.feedback==='bad';let form='';if(o.kind==='quiz')form=`${o.id==='informatica'?`<div class="mini-computer"><div class="bar">🔴 🟡 🟢 &nbsp; Posta del Comune / Messaggi ricevuti</div><div class="mail"><small>Da: assistenza-urgente@non-verificato.example</small><p><strong>⚠️ URGENTE! Devi scrivere la password subito!</strong></p><p>“Clicca e inserisci le credenziali, altrimenti il sito verrà bloccato.”</p></div></div>`:''}<div class="choices">${o.choices.map((a,i)=>`<button class="choice" data-act="answer" data-index="${i}" ${answered?'disabled':''}><span class="num">${i+1}</span>${esc(a)}</button>`).join('')}</div>`;if(o.kind==='pick2')form=`<div class="choices">${o.choices.map((a,i)=>`<button class="choice ${state.selected.has(i)?'selected':''}" data-act="toggle" data-index="${i}" ${answered?'disabled':''}><span class="num">${state.selected.has(i)?'✓':i+1}</span>${esc(a)}</button>`).join('')}</div>${!answered?`<p class="footnote">Seleziona 2 azioni.</p><button class="btn teal" data-act="check" ${state.selected.size!==2?'disabled':''}>✅ Conferma le mie scelte</button>`:''}`;if(o.kind==='sequence')form=`<p style="font-size:14px;font-weight:800;color:#577481">Finora hai scelto:</p><div class="order">${state.order.map(i=>`<span class="ordpill">${esc(o.choices[i])}</span>`).join('')||'<span class="ordpill" style="background:#f0f4f5;color:#60717e">Tocca la prima azione ↓</span>'}</div><div class="choices">${o.choices.map((a,i)=>`<button class="choice ${state.order.includes(i)?'selected':''}" data-act="order" data-index="${i}" ${answered||state.order.includes(i)?'disabled':''}><span class="num">${state.order.includes(i)?'✓':i+1}</span>${esc(a)}</button>`).join('')}</div>`;if(o.kind==='budget'){let total=[...state.selected].reduce((s,i)=>s+o.choices[i].cost,0);form=`<div class="budget">${o.choices.map((a,i)=>`<button class="buy ${state.selected.has(i)?'selected':''}" data-act="toggle" data-index="${i}" ${answered?'disabled':''}><span style="font-size:34px">${esc(a.icon)}</span><span>${esc(a.label)}</span><span class="cost">🪙 ${a.cost}</span></button>`).join('')}</div><div class="budgetbar"><span>${total} / 10 🪙</span><div class="rail"><span class="${total>10?'over':''}" style="width:${Math.min(total*10,100)}%"></span></div></div>${!answered?`<button class="btn teal" data-act="check" ${state.selected.size===0?'disabled':''}>✅ Conferma la spesa</button>`:''}`}
let feedback='';if(answered)feedback=`<div class="result" role="status"><h3>🎉 Missione compiuta! ${state.completed.has(o.id)?'+ un timbro':''}</h3><p>${esc(o.success)}</p><div class="btns">${quick?'<button class="btn teal" data-act="next">'+(state.quickIndex===QUICK.length-1?'🏆 Vedi il risultato':'➡️ Prossima missione')+'</button>':'<button class="btn teal" data-act="home">🗺️ Scegli un altro ufficio</button>'}<button class="btn outline" data-act="sheet" data-id="${o.id}">📱 Scheda insegnanti</button></div></div>`;else if(wrong)feedback=`<div class="result bad" role="status"><h3>💡 Ci sei quasi!</h3><p>${esc(o.mistake)}</p><button class="btn soft" data-act="retry">🔄 Riprova</button></div>`;
app.innerHTML=`<div class="backbar"><div class="crumb">🏠 <a href="#" data-act="home">La mappa</a> / ${esc(title)}</div><div class="scoretop">⭐ ${state.score} punti · 🏅 ${state.completed.size} timbri</div></div>${quick?`<div class="progress" aria-label="Avanzamento delle missioni"><span style="width:${pct}%"></span></div>`:''}<div class="game-layout"><section class="panel"><div class="quest-head"><div class="role">${o.icon} ${esc(o.name)} · ${esc(title)}</div><h1>${esc(o.title)}</h1><p>${esc(o.lead)}</p></div><div class="quest-body"><div class="speech">🗣️ ${esc(o.story)}</div>${!answered?form:''}<div class="hint" role="status">${wrong?'Puoi provare di nuovo!':''}</div>${feedback}</div></section>${side(o)}</div>`;}
function renderFinish(){let won=QUICK.filter(x=>state.completed.has(x)).length;app.innerHTML=`<section class="panel finish"><div class="hero-medal">🏆</div><div class="sheet-label">Missione Charvensod · CCR</div><h1>Missione compiuta!</h1><div class="bigscore">⭐ ${state.score} punti</div><p>Avete aiutato i cittadini, sistemato i documenti, protetto i computer e preso decisioni per la comunità. Ora sapete perché ogni ufficio è importante!</p><div class="stats"><span class="stat">🏅 ${state.completed.size} timbri</span><span class="stat">🎯 ${won}/5 missioni lampo</span></div><div class="btns" style="margin-top:25px"><button class="btn teal" data-act="home">🗺️ Esplora gli altri uffici</button><button class="btn primary" data-act="reset">🔄 Ricomincia da zero</button><button class="btn outline" data-act="qr">📱 Mostra QR</button></div></section>`}
function renderTeachers(){let arr=DATA;app.innerHTML=`<div class="backbar no-print"><button class="btn outline" data-act="home">← Torna al gioco</button><button class="btn teal" data-act="print">🖨️ Stampa i QR</button></div><article class="sheet"><div class="teacherhead"><div><div class="sheet-label">Per le insegnanti · Materiale didattico</div><h1>Un QR per ogni ufficio</h1><p>Inquadra un codice per leggere la scheda dell’ufficio, il suo compito e una domanda da discutere in classe. I 10 uffici corrispondono al passaporto CCR; informatica è una tappa bonus.</p></div><span class="badge">10 uffici + 1 bonus</span></div><div class="qrmain"><div><h2>🎮 Il gioco completo</h2><p>Usa questo QR per far provare il gioco anche dal telefono. Non richiede iscrizione e non chiede nomi o dati personali.</p><a class="teacherlink" target="_blank" rel="noopener" href="${LINKS.gioco}">Apri il gioco nel browser</a></div><div class="qrbox"><img src="${CODES.gioco}" alt="QR code del gioco completo"><b>INQUADRA E GIOCA</b></div></div><div class="section-top"><div><h2>Le schede degli uffici</h2><p>Ogni QR porta direttamente alla scheda dell’ufficio scelto.</p></div></div><div class="qrgallery">${arr.map((o,i)=>`<div class="qrbox qrsmall"><b>${i<10?String(i+1).padStart(2,'0')+' · ':'★ '}${esc(o.name)}</b><img src="${CODES[o.id]}" alt="QR code per ${esc(o.name)}"><a href="${LINKS[o.id]}" target="_blank" rel="noopener">Apri scheda →</a></div>`).join('')}</div><p class="footnote">I codici rimandano a un sito didattico esterno, non al sito istituzionale del Comune. Pagina stampabile dal browser.</p></article>`}
function renderSheet(){let o=get(state.current);if(!o){state.view='home';renderHome();return}let ix=OFFICIAL.findIndex(x=>x.id===o.id);app.innerHTML=`<div class="backbar no-print"><button class="btn outline" data-act="home">← Torna al gioco</button><button class="btn outline" data-act="teachers">📱 Tutti i QR</button></div><article class="sheet"><div class="sheet-label">${ix<0?'BONUS DIGITALE':`TAPPA ${ix+1} / 10`} · Passaporto CCR</div><div class="teacherhead"><div><div class="big-emoji">${icon(o)}</div><h1>${esc(o.name)}</h1><p style="font-size:18px">${esc(o.description)}</p></div><span class="badge">Scopri · Ascolta · Chiedi</span></div><div class="teachers-detail"><div><div class="info"><div class="infocard"><b>🏛️ A cosa serve?</b><p>${esc(o.job)}</p></div><div class="infocard"><b>🎯 Esempio pratico</b><p>${esc(o.lead)}</p></div></div><div class="teacher-q"><strong>❓ Domanda da fare ai bambini</strong><p>${esc(o.question)}</p></div><div class="teacher-q"><strong>🧠 Per continuare in classe</strong><p>${esc(o.extra)}</p></div><div class="btns no-print" style="margin-top:20px"><button class="btn teal" data-act="office" data-id="${o.id}">🎮 Prova la missione</button><button class="btn outline" data-act="print">🖨️ Stampa scheda</button></div></div><div class="qrbox"><img src="${CODES[o.id]}" alt="QR della scheda ${esc(o.name)}"><b>📱 Questa scheda</b><small>La pagina funziona su PC, tablet e telefono.</small></div></div><p class="footnote">Scheda educativa ispirata al passaporto degli uffici CCR di Charvensod, 5 novembre 2026. Le situazioni di gioco sono semplificate.</p></article>`}
function modalQR(){overlay.hidden=false;overlay.innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-label="QR code per accedere al gioco"><div class="modal"><div class="closebar"><button class="tool" data-act="close">✕ Chiudi</button></div><h2>📱 Gioca anche tu!</h2><img src="${CODES.gioco}" alt="QR per aprire Missione Charvensod"><p>Inquadra il QR con la fotocamera del telefono. Nessuna iscrizione, nessun dato personale.</p><button class="btn teal" data-act="teachers">📚 Tutti i QR degli uffici</button></div></div>`;document.body.classList.add('no-overflow')}
function closeModal(){overlay.hidden=true;overlay.innerHTML='';document.body.classList.remove('no-overflow')}
function setView(view,id=null){closeModal();if(id)state.current=id;state.view=view;let url=new URL(location.href);url.search='';if(view==='sheet'&&state.current)url.searchParams.set('ufficio',state.current);if(view==='teachers')url.searchParams.set('insegnanti','1');try{history.pushState(null,'',url)}catch(e){}render();scrollToTop()}
function scrollToTop(){window.scrollTo({top:0,behavior:'instant'})}
function startQuick(){state.mode='quick';state.quickIndex=0;state.selected=new Set();state.order=[];state.feedback=null;state.wrong=0;setView('quest',QUICK[0]);}
function startOffice(id){state.mode='explore';state.selected=new Set();state.order=[];state.feedback=null;state.wrong=0;setView('quest',id)}
function resetSelection(){state.selected.clear();state.order=[];}
function playSound(ok){if(!state.sound)return;try{let A=window.AudioContext||window.webkitAudioContext;if(!A)return;let ctx=window.__sfxContext||(window.__sfxContext=new A());let notes=ok?[523.25,659.25,783.99]:[220,196];notes.forEach((freq,i)=>{let osc=ctx.createOscillator(),g=ctx.createGain(),when=ctx.currentTime+i*.1;osc.type='sine';osc.frequency.value=freq;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(.05,when+.018);g.gain.exponentialRampToValueAtTime(.0001,when+.17);osc.connect(g).connect(ctx.destination);osc.start(when);osc.stop(when+.2)})}catch(e){}}
function mark(ok){let o=get(state.current);if(ok){state.feedback='good';if(!state.completed.has(o.id)){state.score+=state.wrong?60:100;state.completed.add(o.id)}playSound(true)}else{state.feedback='bad';state.wrong++;playSound(false)}renderQuest();}
function check(){const o=get(state.current);if(!o||state.feedback==='good')return;let ok=false;if(o.kind==='pick2')ok=state.selected.size===o.correct.length && o.correct.every(i=>state.selected.has(i));if(o.kind==='budget')ok=state.selected.size===2&&o.correct.every(i=>state.selected.has(i));mark(ok)}
function doOrder(i){const o=get(state.current);if(o.kind!=='sequence'||state.feedback==='good'||state.order.includes(i))return;state.order.push(i);if(state.order.length===o.correct.length){let ok=state.order.every((v,j)=>v===o.correct[j]);mark(ok)}else{playSound(true);renderQuest()}}
function doAnswer(i){const o=get(state.current);if(o?.kind!=='quiz'||state.feedback==='good')return;mark(i===o.correct)}
function doToggle(i){const o=get(state.current);if(!o||state.feedback==='good')return;state.selected.has(i)?state.selected.delete(i):state.selected.add(i);renderQuest()}
function doNext(){state.quickIndex++;if(state.quickIndex>=QUICK.length){setView('finish');return}state.feedback=null;state.wrong=0;resetSelection();setView('quest',QUICK[state.quickIndex])}
function render(){let s=state.view;if(s==='home')renderHome();else if(s==='quest')renderQuest();else if(s==='finish')renderFinish();else if(s==='sheet')renderSheet();else if(s==='teachers')renderTeachers();document.getElementById('soundLabel').textContent=state.sound?'🔊 Suoni':'🔇 Suoni';}
function fullscreen(){const e=document.documentElement;if(!document.fullscreenElement){if(e.requestFullscreen)e.requestFullscreen().catch(()=>{});}else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
function clickHandler(event){const el=event.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')event.preventDefault();const a=el.dataset.act;const id=el.dataset.id;const i=Number(el.dataset.index);switch(a){case'home':setView('home');break;case'quick':startQuick();break;case'explore':setView('home');document.querySelector('.map')?.scrollIntoView({behavior:'smooth'});break;case'office':startOffice(id);break;case'answer':doAnswer(i);break;case'toggle':doToggle(i);break;case'order':doOrder(i);break;case'check':check();break;case'retry':state.feedback=null;resetSelection();renderQuest();break;case'next':doNext();break;case'teachers':setView('teachers');break;case'sheet':setView('sheet',id);break;case'qr':modalQR();break;case'close':closeModal();break;case'print':window.print();break;case'reset':state.completed.clear();state.score=0;state.quickIndex=0;setView('home');break;case'sound':state.sound=!state.sound;document.getElementById('soundLabel').textContent=state.sound?'🔊 Suoni':'🔇 Suoni';break;case'fullscreen':fullscreen();break}}
document.addEventListener('click',clickHandler);overlay.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeModal()});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('popstate',()=>{const p=new URLSearchParams(location.search);if(p.has('ufficio')&&get(p.get('ufficio'))){state.view='sheet';state.current=p.get('ufficio')}else if(p.has('insegnanti'))state.view='teachers';else state.view='home';render()});render();
</script></body></html>
